spring.application.name=arriendos-api

# --- Desactivar Docker Compose de Spring Boot ---
spring.docker.compose.enabled=false

# --- Lee variables desde el archivo .env de la raiz del proyecto (si existe) ---
spring.config.import=optional:file:.env[.properties]

# --- Puerto de tu API ---
# Render/Koyeb/Railway definen PORT; en local queda 8080
server.port=${PORT:8080}
# Detras del proxy HTTPS de la plataforma: respeta X-Forwarded-Proto/Host
server.forward-headers-strategy=framework
# Termina las peticiones en curso antes de apagarse (deploys sin cortes)
server.shutdown=graceful
server.compression.enabled=true

# --- Health check (solo /actuator/health, sin detalles) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# --- Base de datos: PostgreSQL (Supabase en produccion, Docker en local) ---
# Credenciales por variables de entorno (ver .env.example). Nunca escribirlas aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arriendos}
spring.datasource.username=${DB_USERNAME:arriendos}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool chico: Supabase free admite pocas conexiones
spring.datasource.hikari.maximumPoolSize=${DB_POOL_SIZE:5}

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
# OJO: tu paquete base es con guion bajo, no con guion medio
mybatis.type-aliases-package=com.apparriendos.arriendos_api.model
mybatis.configuration.map-underscore-to-camel-case=true

# --- Swagger/OpenAPI (springdoc) ---
# Apagado por defecto; activar en desarrollo con SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# Opcional para URL \u00e2\u0080\u009cbonita\u00e2\u0080\u009d
springdoc.swagger-ui.path=/swagger-ui.html

# true solo en desarrollo: incluye el mensaje SQL en las respuestas de error
# Nunca enviar stack traces al cliente (devtools los activa por defecto)
server.error.include-stacktrace=never

app.error.expose-details=${EXPOSE_ERROR_DETAILS:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
# Front en Vercel: siempre permitido (las peticiones pasan por el proxy pero llevan Origin)
app.cors.front-url=${FRONT_URL:https://arriendos-tau.vercel.app}

# --- Login (JWT) ---
# Clave para firmar tokens: minimo 32 caracteres. Generar con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=arriendos-api
app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:7d}
# Cookie del refresh token. En http://localhost los navegadores aceptan Secure.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
# Primer ADMIN: se crea al arrancar si no existe ninguno. Quitar despues.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Fotos de las propiedades ---
# Con SUPABASE_URL y SUPABASE_SECRET_KEY se guardan en Supabase Storage (produccion).
# Sin ellas, en la carpeta local "uploads" servida en http://localhost:8080/uploads (desarrollo).
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-secret-key=${SUPABASE_SECRET_KEY:}
app.storage.bucket=${SUPABASE_BUCKET:departamentos}
app.storage.local-dir=${UPLOADS_DIR:uploads}
app.storage.local-url=${UPLOADS_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
