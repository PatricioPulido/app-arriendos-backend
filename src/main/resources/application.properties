spring.application.name=arriendos-api

# --- Desactivar Docker Compose de Spring Boot ---
spring.docker.compose.enabled=false

# --- Puerto de tu API ---
server.port=8080

# --- Oracle XE local ---
# Usa SERVICE_NAME (formato @//host:puerto/service). XEPDB1 es service name.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=PATO
spring.datasource.password=pato123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hikari (opcional, pero \u00c3\u00batil)
spring.datasource.hikari.connectionTestQuery=SELECT 1 FROM DUAL
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.connectionInitSql=ALTER SESSION SET CURRENT_SCHEMA=PATO

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
# OJO: tu paquete base es con guion bajo, no con guion medio
mybatis.type-aliases-package=com.apparriendos.arriendos_api.model
mybatis.configuration.map-underscore-to-camel-case=true

# --- Swagger/OpenAPI (springdoc) ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Opcional para URL \u00e2\u0080\u009cbonita\u00e2\u0080\u009d
springdoc.swagger-ui.path=/swagger-ui.html

app.error.expose-details=false

app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
