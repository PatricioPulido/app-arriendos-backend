spring.application.name=arriendos-api

# --- Desactivar Docker Compose de Spring Boot ---
spring.docker.compose.enabled=false

# --- Puerto de tu API ---
server.port=8080

# --- Oracle XE local ---
# Usa SERVICE_NAME (formato @//host:puerto/service). XEPDB1 es service name.
# Credenciales por variables de entorno (ver .env.example). Nunca escribirlas aqui.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
spring.datasource.username=${DB_USERNAME:PATO}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hikari (opcional, pero \u00c3\u00batil)
spring.datasource.hikari.connectionTestQuery=SELECT 1 FROM DUAL
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.connectionInitSql=ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:PATO}

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
# OJO: tu paquete base es con guion bajo, no con guion medio
mybatis.type-aliases-package=com.apparriendos.arriendos_api.model
mybatis.configuration.map-underscore-to-camel-case=true

# --- Swagger/OpenAPI (springdoc) ---
# Apagado por defecto; activar en desarrollo con SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# Opcional para URL \u00e2\u0080\u009cbonita\u00e2\u0080\u009d
springdoc.swagger-ui.path=/swagger-ui.html

# true solo en desarrollo: incluye el mensaje SQL en las respuestas de error
# Nunca enviar stack traces al cliente (devtools los activa por defecto)
server.error.include-stacktrace=never

app.error.expose-details=${EXPOSE_ERROR_DETAILS:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
