# Entorno local completo. Copia .env.example a .env y completa las contrasenas.
#
#   Solo la base de datos (para correr la API desde NetBeans o mvnw):
#     docker compose up -d
#
#   Base de datos + API (no necesitas Java instalado):
#     docker compose --profile app up -d --build
#
# La primera vez que se crea el volumen, Postgres aplica db/migrations/*.sql
# automaticamente. Para partir de cero (borra los datos): docker compose down -v
services:
  postgres:
    image: postgres:17-alpine
    container_name: arriendos-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: arriendos
      POSTGRES_USER: ${DB_USERNAME:-arriendos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d arriendos"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["app"]
    build: .
    container_name: arriendos-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro de docker la BD no esta en localhost sino en el servicio postgres
      DB_URL: jdbc:postgresql://postgres:5432/arriendos
    volumes:
      - uploads-data:/app/uploads   # fotos locales (si no defines SUPABASE_URL)
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  uploads-data:
